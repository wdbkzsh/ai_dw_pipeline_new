# ==========================================
# 农户生产异常预警分析 - 业务指标分析
# Version: 1.0
# ==========================================

project:
  project_id: wens_dw_project
  project_name: 农户生产异常预警分析
  business_domain: 育肥作业管理

# ==========================================
# 1. 项目业务理解
# ==========================================

business_context:
  background: >
    温氏集团育肥作业管理业务域，通过采集农户生产过程中的死淘率、采食量等核心指标，
    自动触发生产异常预警，并关联巡查工单进行闭环管理。
    当前需要建设农户生产异常预警分析看板（分公司维度），实现异常监控、归因分析和效果评估。
  business_goal:
    - 实时监控各分公司农户生产异常现状（异常农户数、占比、预警分布）
    - 分析异常原因分布及策略有效性
    - 评估预警关闭率、7天复发率、有效干涉率等核心运营指标
    - 按月追踪核心指标变化趋势
  service_users:
    - 分公司管理人员
    - 运营管理人员
    - 业务决策层

# ==========================================
# 2. 页面分析
# ==========================================

page_analysis:
  pages:
    - page_id: P01
      page_name: 农户生产异常运营看板（分公司）
      business_purpose: 面向分公司的生产异常运营监控大屏，包含核心指标卡、预警分布、归因分析、效果评估和趋势追踪
      components:
        - component_name: 核心指标卡-生产异常农户总数
          display_metrics:
            - 生产异常农户总数
            - 异常农户占比
            - 持续中预警农户数
            - 今日仅通知农户数
          display_grain: 月度/当日
        - component_name: 持续中预警细分
          display_metrics:
            - 持续中-需巡查农户数
            - 持续中-无需巡查农户数
          display_grain: 当日
        - component_name: 按预警指标趋势（折线图）
          display_metrics:
            - 各预警指标下异常养户数
          display_grain: 月度
        - component_name: 按预警等级趋势（柱状图）
          display_metrics:
            - 各预警等级下异常养户数
          display_grain: 月度
        - component_name: 预警清单
          display_metrics:
            - 组织、养户、猪群编码、预警指标、预警等级、触发预警时数值、预警时间、预警状态
          display_grain: 单条预警记录
        - component_name: 异常原因分布
          display_metrics:
            - 按风险大类+风险项分类的占比
          display_grain: 月度
        - component_name: 策略有效性
          display_metrics:
            - 策略采纳率
          display_grain: 月度
        - component_name: 异常农户清单
          display_metrics:
            - 组织、养户、猪群编码、管理员、加权进苗日期、苗总数量、预警指标
          display_grain: 单条预警记录
        - component_name: 本月预警效果评估
          display_metrics:
            - 预警关闭占比
            - 较上月
            - 平均持续时长
            - 7天复发率
          display_grain: 月度
        - component_name: 趋势折线图
          display_metrics:
            - 有效干涉率月度趋势
            - 平均持续时长月度趋势
            - 7天复发率月度趋势
          display_grain: 月度

# ==========================================
# 3. 业务对象识别
# ==========================================

business_objects:
  objects:
    - object_name: 养户
      business_definition: 与温氏签订合作协议的养殖户，是生产管理的基本单元
      business_grain: 一个养户档案 = 一个独立的养殖合作主体
      core_attributes:
        - 养户编码
        - 养户档案名称
        - 组织
        - 养殖场名称
        - 管理员
        - 饲养状态
        - 开户人姓名
    - object_name: 猪群
      business_definition: 一个养户下的一批养殖猪群，是生产跟踪的基本单位
      business_grain: 一个畜禽档案 = 一个养户下的一批猪群
      core_attributes:
        - 编码
        - 名称
        - 养户档案名称
        - 饲养品种
        - 猪群状态
        - 首次进苗日期
        - 存栏量
        - 饲养批次
    - object_name: 预警事件
      business_definition: 当农户生产过程中死淘率或采食量等指标触发阈值时，系统自动产生的预警记录
      business_grain: 一条预警单据 = 一次生产异常预警事件
      core_attributes:
        - 单据编号
        - 组织
        - 养户
        - 猪群编码
        - 预警指标
        - 预警等级
        - 触发预警时数值
        - 预警时间
        - 预警状态
        - 持续时长
        - 是否巡查
    - object_name: 巡查工单
      business_definition: 针对持续中预警，由运营人员发起的现场巡查处理单据
      business_grain: 一条巡查工单 = 一次巡查处理事件
      core_attributes:
        - 单据编号
        - 组织
        - 养户
        - 猪群编码
        - 预警指标
        - 预警等级
        - 预警状态
        - 巡查工单状态
        - 预警单据编号
        - 执行人
    - object_name: 应对策略
      business_definition: 针对异常原因预定义的风险分类和应对策略参考库
      business_grain: 一条策略记录 = 一条风险-策略映射关系
      core_attributes:
        - 名称
        - 组织
        - 组织层级
        - 风险大类
        - 风险项
        - 对应策略

# ==========================================
# 4. 业务过程分析
# ==========================================

business_process_analysis:
  processes:
    - process_name: 预警事件产生
      process_type: event
      business_object: 预警事件
      process_grain: 一条预警事件（wens_production_anomaly 一行）
      process_description: >
        系统根据生产数据（死淘率、采食量）与预设阈值对比，自动生成预警记录。
        每条记录关联一个养户的一个猪群，标记预警指标、等级、触发值和时间。
    - process_name: 巡查处理
      process_type: event
      business_object: 巡查工单
      process_grain: 一条巡查工单（wens_patrol_ticket 一行）
      process_description: >
        针对持续中预警，运营人员创建巡查工单，记录风险分析、应对策略和执行结果。
        工单通过预警单据编号关联原始预警事件。包含两个分录：原因分析分录和自定义风险分录。

# ==========================================
# 5. 指标分析
# ==========================================

metrics:
  atomic_metrics:
    - metric_id: M01
      metric_name: 生产异常农户总数
      business_definition: 当前处于持续中和仅通知状态的预警涉及的养户去重数
      statistic_object: 养户
      statistic_grain: 养户
      calculation_logic: 筛选预警状态为持续中或仅通知的预警记录，按养户去重计数
      business_rules:
        - 预警状态为"持续中"或"仅通知"
        - 按养户去重
    - metric_id: M02
      metric_name: 持续中预警农户数
      business_definition: 当前处于持续中状态的预警涉及的养户去重数
      statistic_object: 养户
      statistic_grain: 养户
      calculation_logic: 筛选预警状态为持续中的预警记录，按养户去重计数
      business_rules:
        - 预警状态为"持续中"
        - 按养户去重
    - metric_id: M03
      metric_name: 持续中-需巡查农户数
      business_definition: 持续中预警中是否巡查为是的养户去重数
      statistic_object: 养户
      statistic_grain: 养户
      calculation_logic: 筛选预警状态为持续中且是否巡查为是的预警记录，按养户去重计数
      business_rules:
        - 预警状态为"持续中"
        - 是否巡查为"是"
        - 按养户去重
    - metric_id: M04
      metric_name: 持续中-无需巡查农户数
      business_definition: 持续中预警中是否巡查为否的养户去重数
      statistic_object: 养户
      statistic_grain: 养户
      calculation_logic: 筛选预警状态为持续中且是否巡查为否的预警记录，按养户去重计数
      business_rules:
        - 预警状态为"持续中"
        - 是否巡查为"否"
        - 按养户去重
    - metric_id: M05
      metric_name: 今日仅通知农户数
      business_definition: 当日预警状态为仅通知的养户去重数
      statistic_object: 养户
      statistic_grain: 养户
      calculation_logic: 筛选预警状态为仅通知的预警记录，按养户去重计数
      business_rules:
        - 预警状态为"仅通知"
        - 按养户去重
    - metric_id: M06
      metric_name: 预警关闭占比
      business_definition: 预警状态为已关闭的预警数占总预警数的比例
      statistic_object: 预警事件
      statistic_grain: 预警事件
      calculation_logic: 预警状态为已关闭的记录数 / 全部预警记录数
      business_rules:
        - 预警状态为"已关闭"
    - metric_id: M07
      metric_name: 平均持续时长
      business_definition: 预警记录的持续时长平均值
      statistic_object: 预警事件
      statistic_grain: 预警事件
      calculation_logic: 对所有预警记录的持续时长字段取平均值
      business_rules: []
    - metric_id: M08
      metric_name: 7天复发率
      business_definition: 7天内同一组织+养户+猪群+预警指标+等级再次触发预警的占比
      statistic_object: 预警事件
      statistic_grain: 预警事件
      calculation_logic: >
        按组织+养户+猪群+预警指标+预警等级分组，
        判断7天内是否有两条及以上预警，计算有复发的组数/总组数
      business_rules:
        - 分组条件：组织+养户+猪群编码+预警指标+预警等级
        - 时间间隔：两条预警触发时间 ≤ 7天
    - metric_id: M09
      metric_name: 有效干涉率
      business_definition: 巡查工单状态为已完成的占比
      statistic_object: 巡查工单
      statistic_grain: 巡查工单
      calculation_logic: 巡查工单状态为已完成的记录数 / 全部巡查工单记录数
      business_rules:
        - 巡查工单状态为"已完成"

  composite_metrics:
    - metric_id: C01
      metric_name: 异常农户占比
      business_definition: 生产异常农户数占总养户数的比例
      formula: 生产异常农户总数 / 总养户数
      component_metrics:
        - M01
        - 总养户数

  trend_metrics:
    - metric_id: T01
      metric_name: 按预警指标趋势
      statistic_object: 养户
      statistic_grain: 养户（按预警指标分组）
      display_time_grain: 月度
      analysis_dimensions:
        - 预警指标
    - metric_id: T02
      metric_name: 按预警等级趋势
      statistic_object: 养户
      statistic_grain: 养户（按预警等级分组）
      display_time_grain: 月度
      analysis_dimensions:
        - 预警等级
    - metric_id: T03
      metric_name: 有效干涉率趋势
      statistic_object: 巡查工单
      statistic_grain: 巡查工单
      display_time_grain: 月度
      analysis_dimensions: []
    - metric_id: T04
      metric_name: 平均持续时长趋势
      statistic_object: 预警事件
      statistic_grain: 预警事件
      display_time_grain: 月度
      analysis_dimensions: []
    - metric_id: T05
      metric_name: 7天复发率趋势
      statistic_object: 预警事件
      statistic_grain: 预警事件
      display_time_grain: 月度
      analysis_dimensions: []

# ==========================================
# 6. 指标业务粒度分析
# ==========================================

metric_grain_analysis:
  metrics:
    - metric_id: M01
      metric_name: 生产异常农户总数
      analysis_object: 养户
      business_statistic_grain: 养户
      source_grain: 一条生产异常预警事件
      display_grain: 月度/当日
      calculation_basis: 预警状态为持续中或仅通知
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
        - 预警状态
      aggregation_path: >
        生产异常预警事件 → 过滤预警状态为持续中、仅通知 → 按养户去重 → 统计异常农户数量
      calculation_logic_summary: 按养户去重计数，筛选持续中和仅通知状态

    - metric_id: M02
      metric_name: 持续中预警农户数
      analysis_object: 养户
      business_statistic_grain: 养户
      source_grain: 一条生产异常预警事件
      display_grain: 月度/当日
      calculation_basis: 预警状态为持续中
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 过滤预警状态为持续中 → 按养户去重 → 统计持续中农户数量
      calculation_logic_summary: 按养户去重计数，筛选持续中状态

    - metric_id: M03
      metric_name: 持续中-需巡查农户数
      analysis_object: 养户
      business_statistic_grain: 养户
      source_grain: 一条生产异常预警事件
      display_grain: 月度/当日
      calculation_basis: 预警状态为持续中且是否巡查为是
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 过滤预警状态为持续中且是否巡查为是 → 按养户去重 → 统计需巡查农户数量
      calculation_logic_summary: 按养户去重计数，筛选持续中且需巡查

    - metric_id: M04
      metric_name: 持续中-无需巡查农户数
      analysis_object: 养户
      business_statistic_grain: 养户
      source_grain: 一条生产异常预警事件
      display_grain: 月度/当日
      calculation_basis: 预警状态为持续中且是否巡查为否
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 过滤预警状态为持续中且是否巡查为否 → 按养户去重 → 统计无需巡查农户数量
      calculation_logic_summary: 按养户去重计数，筛选持续中且无需巡查

    - metric_id: M05
      metric_name: 今日仅通知农户数
      analysis_object: 养户
      business_statistic_grain: 养户
      source_grain: 一条生产异常预警事件
      display_grain: 当日
      calculation_basis: 预警状态为仅通知
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 过滤预警状态为仅通知 → 按养户去重 → 统计仅通知农户数量
      calculation_logic_summary: 按养户去重计数，筛选仅通知状态

    - metric_id: C01
      metric_name: 异常农户占比
      analysis_object: 养户
      business_statistic_grain: 养户
      source_grain: 一条生产异常预警事件 + 养户档案全量
      display_grain: 月度/当日
      calculation_basis: 生产异常农户总数 / 总养户数
      drill_down_dimensions:
        - 日期
        - 组织
      aggregation_path: >
        ① 生产异常预警事件 → 过滤持续中、仅通知 → 按养户去重 = 异常农户数
        → ② 养猪养户档案全量 = 总养户数
        → ①/② = 占比
      calculation_logic_summary: 异常农户数除以总养户数

    - metric_id: T01
      metric_name: 按预警指标趋势
      analysis_object: 养户
      business_statistic_grain: 养户（按预警指标分组）
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 按预警指标+养户去重统计
      drill_down_dimensions:
        - 日期
        - 组织
        - 预警指标
        - 养户
        - 猪群
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 过滤持续中、仅通知 → 按预警指标+养户去重 → 按月统计各预警指标下异常养户数
      calculation_logic_summary: 按预警指标分组，每月各指标下异常养户去重数

    - metric_id: T02
      metric_name: 按预警等级趋势
      analysis_object: 养户
      business_statistic_grain: 养户（按预警等级分组）
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 按预警等级+养户去重统计
      drill_down_dimensions:
        - 日期
        - 组织
        - 预警等级
        - 养户
        - 猪群
        - 预警指标
      aggregation_path: >
        生产异常预警事件 → 过滤持续中、仅通知 → 按预警等级+养户去重 → 按月统计各预警等级下异常养户数
      calculation_logic_summary: 按预警等级分组，每月各等级下异常养户去重数

    - metric_id: M06
      metric_name: 预警关闭占比
      analysis_object: 预警事件
      business_statistic_grain: 预警事件
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 预警状态为已关闭
      drill_down_dimensions:
        - 日期
        - 组织
      aggregation_path: >
        生产异常预警事件 → 统计预警状态为已关闭的记录数 → / 全部预警记录数 → 预警关闭占比
      calculation_logic_summary: 已关闭预警数除以总预警数

    - metric_id: M07
      metric_name: 平均持续时长
      analysis_object: 预警事件
      business_statistic_grain: 预警事件
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 持续时长字段取平均值
      drill_down_dimensions:
        - 日期
        - 组织
      aggregation_path: >
        生产异常预警事件 → 取持续时长字段 → 计算平均值
      calculation_logic_summary: 对持续时长字段求平均

    - metric_id: M08
      metric_name: 7天复发率
      analysis_object: 预警事件
      business_statistic_grain: 预警事件（按组织+养户+猪群+预警指标+等级分组）
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 组织+养户+猪群+预警指标+等级一致，时间间隔≤7天
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 按组织+养户+猪群+预警指标+预警等级分组
        → 组内按预警时间排序 → 判断相邻预警时间间隔是否≤7天
        → 有复发的组数/总组数 = 7天复发率
      calculation_logic_summary: 同组7天内再次触发预警的组数占比

    - metric_id: M09
      metric_name: 有效干涉率
      analysis_object: 巡查工单
      business_statistic_grain: 巡查工单
      source_grain: 一条巡查工单
      display_grain: 月度
      calculation_basis: 巡查工单状态为已完成
      drill_down_dimensions:
        - 日期
        - 组织
      aggregation_path: >
        巡查工单 → 统计巡查工单状态为已完成的记录数 → / 全部巡查工单记录数 → 有效干涉率
      calculation_logic_summary: 已完成工单数除以总工单数

    - metric_id: T03
      metric_name: 有效干涉率趋势
      analysis_object: 巡查工单
      business_statistic_grain: 巡查工单
      source_grain: 一条巡查工单
      display_grain: 月度
      calculation_basis: 按月统计已完成工单占比
      drill_down_dimensions:
        - 日期
        - 组织
      aggregation_path: >
        巡查工单 → 按月统计已完成工单占比 → 月度折线图
      calculation_logic_summary: 每月已完成工单占比的月度趋势

    - metric_id: T04
      metric_name: 平均持续时长趋势
      analysis_object: 预警事件
      business_statistic_grain: 预警事件
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 按月计算持续时长平均值
      drill_down_dimensions:
        - 日期
        - 组织
      aggregation_path: >
        生产异常预警事件 → 按月计算持续时长平均值 → 月度折线图
      calculation_logic_summary: 每月平均持续时长的月度趋势

    - metric_id: T05
      metric_name: 7天复发率趋势
      analysis_object: 预警事件
      business_statistic_grain: 预警事件（按组织+养户+猪群+预警指标+等级分组）
      source_grain: 一条生产异常预警事件
      display_grain: 月度
      calculation_basis: 按月计算7天复发率
      drill_down_dimensions:
        - 日期
        - 组织
        - 养户
        - 猪群
        - 预警指标
        - 预警等级
      aggregation_path: >
        生产异常预警事件 → 按月计算7天复发率 → 月度折线图
      calculation_logic_summary: 每月7天复发率的月度趋势

# ==========================================
# 7. 业务规则
# ==========================================

business_rules:
  rules:
    - rule_id: R01
      rule_description: 预警状态定义：1=持续中，2=已关闭，3=仅通知
      related_metrics:
        - M01
        - M02
        - M03
        - M04
        - M05
        - M06
      priority: confirmed
    - rule_id: R02
      rule_description: 巡查工单状态定义：1=未完成，2=已完成，3=未完成(过期)
      related_metrics:
        - M09
        - T03
      priority: confirmed
    - rule_id: R03
      rule_description: >
        7天复发率分组条件：组织+养户+猪群编码+预警指标+预警等级一致，
        两条预警触发时间间隔≤7天即为复发
      related_metrics:
        - M08
        - T05
      priority: confirmed
    - rule_id: R04
      rule_description: >
        预警关闭占比 = 预警状态为已关闭的记录数 / 全部预警记录数
      related_metrics:
        - M06
      priority: confirmed
    - rule_id: R05
      rule_description: >
        策略有效性 = 采纳的分录条数 / 全部分录条数
      related_metrics: []
      priority: confirmed
    - rule_id: R06
      rule_description: 预警指标定义：1=两周死淘率，2=五周死淘率，3=单日死淘率，4=连续2天死淘率，5=连续3天死淘率，6=连续4天死淘率，7=单日采食量，8=连续2天采食量，9=连续3天采食量
      related_metrics:
        - T01
      priority: confirmed
    - rule_id: R07
      rule_description: 预警等级定义：1=一级告警，2=二级告警，3=三级告警，4=四级告警
      related_metrics:
        - T02
      priority: confirmed
    - rule_id: R08
      rule_description: >
        数据关联规则：预警→巡查工单通过预警单据编号(wens_warning_billno)关联；
        预警→养户通过fk_wens_basedatafield关联wens_rearer_farm_pig；
        预警→猪群通过fk_wens_recbrlrflk_pig关联wens_recbrlrflk_pig
      related_metrics:
        - M01
        - M02
        - M09
      priority: confirmed

