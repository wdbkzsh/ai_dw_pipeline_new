# ==========================================
# 指标实现分析
# 农户生产异常预警分析
# ==========================================

project:
  project_id: wens_dw_project
  project_name: 农户生产异常预警分析
  business_domain: 育肥作业管理

metric_implementation_analysis:
  metrics:
    - metric_id: M01
      metric_name: 生产异常农户总数
      business_definition: 当前处于持续中和仅通知状态的预警涉及的养户去重数
      statistic_grain: 养户
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件
                description: 预警状态
      technical_logic: >
        从预警表中筛选预警状态为持续中(1)或仅通知(3)的记录，
        按养户(fk_wens_basedatafield)去重计数。
      calculation_pseudocode: |
        SELECT COUNT(DISTINCT fk_wens_basedatafield) AS anomaly_farmer_count
        FROM tk_wens_production_anomal
        WHERE fbillstatus = 'C'
          AND fk_wens_status IN ('1', '3')
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
        - fk_wens_status IN ('1', '3')  -- 持续中、仅通知
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield)
      duplicate_handling: 按养户去重，同一养户多条预警只计一次
      time_logic: 当前快照，取全量数据（不按时间过滤）
      implementation_risk: []

    - metric_id: M02
      metric_name: 持续中预警农户数
      business_definition: 当前处于持续中状态的预警涉及的养户去重数
      statistic_grain: 养户
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件（1=持续中）
                description: 预警状态
      technical_logic: >
        从预警表中筛选预警状态为持续中(1)的记录，
        按养户去重计数。
      calculation_pseudocode: |
        SELECT COUNT(DISTINCT fk_wens_basedatafield) AS ongoing_farmer_count
        FROM tk_wens_production_anomal
        WHERE fbillstatus = 'C'
          AND fk_wens_status = '1'
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
        - fk_wens_status = '1'  -- 持续中
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield)
      duplicate_handling: 按养户去重
      time_logic: 当前快照
      implementation_risk: []

    - metric_id: M03
      metric_name: 持续中-需巡查农户数
      business_definition: 持续中预警中是否巡查为是的养户去重数
      statistic_grain: 养户
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件（1=持续中）
                description: 预警状态
              - field_name: fk_wens_is_generate_ticke
                field_usage: 过滤条件（是否巡查=是）
                description: 是否巡查
      technical_logic: >
        从预警表中筛选预警状态为持续中(1)且是否巡查为是的记录，
        按养户去重计数。
      calculation_pseudocode: |
        SELECT COUNT(DISTINCT fk_wens_basedatafield) AS patrol_farmer_count
        FROM tk_wens_production_anomal
        WHERE fbillstatus = 'C'
          AND fk_wens_status = '1'
          AND fk_wens_is_generate_ticke = '1'  -- 1=是
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
        - fk_wens_status = '1'  -- 持续中
        - fk_wens_is_generate_ticke = '1'  -- 是(0=否,1=是)
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield)
      duplicate_handling: 按养户去重
      time_logic: 当前快照
      implementation_risk: []

    - metric_id: M04
      metric_name: 持续中-无需巡查农户数
      business_definition: 持续中预警中是否巡查为否的养户去重数
      statistic_grain: 养户
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件（1=持续中）
                description: 预警状态
              - field_name: fk_wens_is_generate_ticke
                field_usage: 过滤条件（是否巡查=否）
                description: 是否巡查
      technical_logic: >
        从预警表中筛选预警状态为持续中(1)且是否巡查为否的记录，
        按养户去重计数。
      calculation_pseudocode: |
        SELECT COUNT(DISTINCT fk_wens_basedatafield) AS no_patrol_farmer_count
        FROM tk_wens_production_anomal
        WHERE fbillstatus = 'C'
          AND fk_wens_status = '1'
          AND fk_wens_is_generate_ticke = '0'  -- 0=否
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
        - fk_wens_status = '1'  -- 持续中
        - fk_wens_is_generate_ticke = '0'  -- 否(0=否,1=是)
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield)
      duplicate_handling: 按养户去重
      time_logic: 当前快照
      implementation_risk: []

    - metric_id: M05
      metric_name: 今日仅通知农户数
      business_definition: 当日预警状态为仅通知的养户去重数
      statistic_grain: 养户
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件（3=仅通知）
                description: 预警状态
              - field_name: fk_wens_alarm_time
                field_usage: 日期过滤（当日）
                description: 预警时间
      technical_logic: >
        从预警表中筛选预警状态为仅通知(3)且预警时间为当日的记录，
        按养户去重计数。
      calculation_pseudocode: |
        SELECT COUNT(DISTINCT fk_wens_basedatafield) AS notify_only_farmer_count
        FROM tk_wens_production_anomal
        WHERE fbillstatus = 'C'
          AND fk_wens_status = '3'
          AND DATE(fk_wens_alarm_time) = CURRENT_DATE
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
        - fk_wens_status = '3'  -- 仅通知
        - DATE(fk_wens_alarm_time) = 当前日期
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield)
      duplicate_handling: 按养户去重
      time_logic: 当日过滤
      implementation_risk:
        - fk_wens_alarm_time为长日期类型，需确认时区和格式

    - metric_id: M06
      metric_name: 预警关闭占比
      business_definition: 预警状态为已关闭的预警数占总预警数的比例
      statistic_grain: 预警事件
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_status
                field_usage: 分子=已关闭(2), 分母=全部
                description: 预警状态
              - field_name: fk_wens_alarm_time
                field_usage: 按月过滤（待确认）
                description: 预警时间
      technical_logic: >
        统计预警状态为已关闭(2)的记录数占全部预警记录数的比例。
        按月统计时需按预警时间过滤月份。
      calculation_pseudocode: |
        -- 模型提供明细数据，BI端计算占比
        SELECT *
        FROM tk_wens_production_anomal
        WHERE fbillstatus = 'C'
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
      aggregation_logic: 明细数据，BI端计算 SUM(CASE WHEN 已关闭 THEN 1 ELSE 0 END) / COUNT(*)
      duplicate_handling: 按预警事件计数，无需去重
      time_logic: 明细数据由BI端按需过滤时间范围
      implementation_risk: []

    - metric_id: M07
      metric_name: 平均持续时长
      business_definition: 预警记录的持续时长平均值
      statistic_grain: 预警事件
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_duration
                field_usage: 取平均值
                description: 持续时长
              - field_name: fk_wens_alarm_time
                field_usage: 按月过滤
                description: 预警时间
      technical_logic: >
        对持续时长字段取平均值。单位虽不明确但全局统一，不影响趋势分析。
      calculation_pseudocode: |
        SELECT AVG(fk_wens_duration) AS avg_duration
        FROM tk_wens_production_anomal
      filter_conditions: []
      aggregation_logic: AVG(fk_wens_duration)
      duplicate_handling: 直接平均
      time_logic: 按月统计
      implementation_risk: []

    - metric_id: M08
      metric_name: 7天复发率
      business_definition: 7天内同一组织+养户+猪群+预警指标+等级再次触发预警的占比
      statistic_grain: 预警事件（按分组）
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: forgid
                field_usage: 分组条件-组织
                description: 组织
              - field_name: fk_wens_basedatafield
                field_usage: 分组条件-养户
                description: 养户
              - field_name: fk_wens_recbrlrflk_pig
                field_usage: 分组条件-猪群
                description: 猪群编码
              - field_name: fk_wens_alert_metric
                field_usage: 分组条件-预警指标
                description: 预警指标
              - field_name: fk_wens_alarm_level
                field_usage: 分组条件-预警等级
                description: 预警等级
              - field_name: fk_wens_alarm_time
                field_usage: 时间间隔计算
                description: 预警时间
      technical_logic: >
        按组织+养户+猪群+预警指标+预警等级分组，
        组内按预警时间排序，判断相邻预警时间间隔是否≤7天，
        计算有复发的组数/总组数。不过滤预警状态。
      calculation_pseudocode: |
        -- 步骤1：分组并标记复发
        WITH grouped_alerts AS (
          SELECT
            forgid, fk_wens_basedatafield, fk_wens_recbrlrflk_pig,
            fk_wens_alert_metric, fk_wens_alarm_level, fk_wens_alarm_time,
            LAG(fk_wens_alarm_time) OVER (
              PARTITION BY forgid, fk_wens_basedatafield, fk_wens_recbrlrflk_pig,
                           fk_wens_alert_metric, fk_wens_alarm_level
              ORDER BY fk_wens_alarm_time
            ) AS prev_alarm_time
          FROM tk_wens_production_anomal
          WHERE fbillstatus = 'C'
        ),
        recurrence AS (
          SELECT
            forgid, fk_wens_basedatafield, fk_wens_recbrlrflk_pig,
            fk_wens_alert_metric, fk_wens_alarm_level,
            MAX(CASE
              WHEN DATEDIFF(fk_wens_alarm_time, prev_alarm_time) <= 7 THEN 1
              ELSE 0
            END) AS has_recurrence
          FROM grouped_alerts
          GROUP BY forgid, fk_wens_basedatafield, fk_wens_recbrlrflk_pig,
                   fk_wens_alert_metric, fk_wens_alarm_level
        )
        SELECT
          SUM(has_recurrence) * 1.0 / COUNT(*) AS recurrence_rate_7d
        FROM recurrence
      filter_conditions:
        - fbillstatus = 'C'  -- 已审核
        - 不过滤预警状态
      aggregation_logic: 有复发的组数 / 总组数
      duplicate_handling: 按分组去重后统计
      time_logic: 按月统计时需限定当月的预警记录
      implementation_risk:
        - 计算逻辑复杂，需要窗口函数
        - 分组内只有1条记录的组不参与复发判断

    - metric_id: M09
      metric_name: 有效干涉率
      business_definition: 巡查工单状态为已完成的占比
      statistic_grain: 巡查工单
      source_analysis:
        tables:
          - table_name: wens_patrol_ticket
            fields:
              - field_name: fk_wens_atrol_ticket_stat
                field_usage: 分子=已完成(2), 分母=全部
                description: 巡查工单状态
              - field_name: fcreatetime
                field_usage: 按月过滤
                description: 创建时间
      technical_logic: >
        统计巡查工单状态为已完成(2)的记录数占全部工单记录数的比例。
      calculation_pseudocode: |
        SELECT
          DATE_FORMAT(fcreatetime, '%Y-%m') AS month,
          SUM(CASE WHEN fk_wens_atrol_ticket_stat = '2' THEN 1 ELSE 0 END) * 1.0
            / COUNT(*) AS intervention_rate
        FROM tk_wens_patrol_ticket
        GROUP BY DATE_FORMAT(fcreatetime, '%Y-%m')
      filter_conditions: []
      aggregation_logic: SUM(CASE WHEN 已完成 THEN 1 ELSE 0 END) / COUNT(*)
      duplicate_handling: 按工单计数，无需去重
      time_logic: 按月统计
      implementation_risk:
        - 需确认时间字段用创建时间还是审核时间

    - metric_id: C01
      metric_name: 异常农户占比
      business_definition: 生产异常农户数占总养户数的比例
      statistic_grain: 养户
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件
                description: 预警状态
          - table_name: wens_rearer_farm_pig
            fields:
              - field_name: fmasterid
                field_usage: 养户唯一标识，用于COUNT
                description: 主数据内码
              - field_name: fstatus
                field_usage: 过滤条件（C=已审核）
                description: 数据状态
              - field_name: fenable
                field_usage: 过滤条件（1=可用）
                description: 使用状态
      technical_logic: >
        分子：预警状态为持续中或仅通知的养户去重数。
        分母：养户档案中数据状态为已审核(fstatus='C')且使用状态为可用(fenable='1')的记录数。
      calculation_pseudocode: |
        -- 分子
        SELECT COUNT(DISTINCT fk_wens_basedatafield) AS anomaly_count
        FROM tk_wens_production_anomal
        WHERE fk_wens_status IN ('1', '3')

        -- 分母
        SELECT COUNT(*) AS total_count
        FROM tk_wens_rea_farm_info
        WHERE fstatus = 'C' AND fenable = '1'

        -- 占比 = 分子 / 分母
      filter_conditions:
        - fstatus = 'C'  -- 已审核
        - fenable = '1'  -- 可用
      aggregation_logic: 异常农户数 / 总养户数
      duplicate_handling: 分子按养户去重，分母直接COUNT
      time_logic: 当前快照
      implementation_risk: []

    - metric_id: T01
      metric_name: 按预警指标趋势
      business_definition: 按预警指标分类的月度异常养户数趋势
      statistic_grain: 养户（按预警指标分组）
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件
                description: 预警状态
              - field_name: fk_wens_alert_metric
                field_usage: 分组维度
                description: 预警指标
              - field_name: fk_wens_alarm_time
                field_usage: 月份提取
                description: 预警时间
      technical_logic: >
        按月+预警指标分组，每组内按养户去重计数。
      calculation_pseudocode: |
        SELECT
          DATE_FORMAT(fk_wens_alarm_time, '%Y-%m') AS month,
          fk_wens_alert_metric,
          COUNT(DISTINCT fk_wens_basedatafield) AS farmer_count
        FROM tk_wens_production_anomal
        WHERE fk_wens_status IN ('1', '3')
        GROUP BY DATE_FORMAT(fk_wens_alarm_time, '%Y-%m'), fk_wens_alert_metric
      filter_conditions:
        - fk_wens_status IN ('1', '3')
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield) GROUP BY month, alert_metric
      duplicate_handling: 按养户去重
      time_logic: 按月分组
      implementation_risk:
        - 需确认预警指标枚举值到中文名称的映射

    - metric_id: T02
      metric_name: 按预警等级趋势
      business_definition: 按预警等级分类的月度异常养户数趋势
      statistic_grain: 养户（按预警等级分组）
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_basedatafield
                field_usage: 养户标识，用于DISTINCT去重
                description: 养户
              - field_name: fk_wens_status
                field_usage: 过滤条件
                description: 预警状态
              - field_name: fk_wens_alarm_level
                field_usage: 分组维度
                description: 预警等级
              - field_name: fk_wens_alarm_time
                field_usage: 月份提取
                description: 预警时间
      technical_logic: >
        按月+预警等级分组，每组内按养户去重计数。
      calculation_pseudocode: |
        SELECT
          DATE_FORMAT(fk_wens_alarm_time, '%Y-%m') AS month,
          fk_wens_alarm_level,
          COUNT(DISTINCT fk_wens_basedatafield) AS farmer_count
        FROM tk_wens_production_anomal
        WHERE fk_wens_status IN ('1', '3')
        GROUP BY DATE_FORMAT(fk_wens_alarm_time, '%Y-%m'), fk_wens_alarm_level
      filter_conditions:
        - fk_wens_status IN ('1', '3')
      aggregation_logic: COUNT(DISTINCT fk_wens_basedatafield) GROUP BY month, alarm_level
      duplicate_handling: 按养户去重
      time_logic: 按月分组
      implementation_risk:
        - 需确认预警等级枚举值到中文名称的映射

    - metric_id: T03
      metric_name: 有效干涉率趋势
      business_definition: 按月统计已完成巡查工单占比的月度趋势
      statistic_grain: 巡查工单
      source_analysis:
        tables:
          - table_name: wens_patrol_ticket
            fields:
              - field_name: fk_wens_atrol_ticket_stat
                field_usage: 工单状态过滤
                description: 巡查工单状态
              - field_name: fcreatetime
                field_usage: 月份提取
                description: 创建时间
      technical_logic: >
        按月统计已完成工单占比。
      calculation_pseudocode: |
        SELECT
          DATE_FORMAT(fcreatetime, '%Y-%m') AS month,
          SUM(CASE WHEN fk_wens_atrol_ticket_stat = '2' THEN 1 ELSE 0 END) * 1.0
            / COUNT(*) AS intervention_rate
        FROM tk_wens_patrol_ticket
        GROUP BY DATE_FORMAT(fcreatetime, '%Y-%m')
      filter_conditions: []
      aggregation_logic: 已完成工单数 / 总工单数，按月分组
      duplicate_handling: 按工单计数
      time_logic: 按月分组
      implementation_risk:
        - 时间字段选择需确认

    - metric_id: T04
      metric_name: 平均持续时长趋势
      business_definition: 按月统计预警平均持续时长的月度趋势
      statistic_grain: 预警事件
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: fk_wens_duration
                field_usage: 取平均值
                description: 持续时长
              - field_name: fk_wens_alarm_time
                field_usage: 月份提取
                description: 预警时间
      technical_logic: >
        按月计算持续时长平均值。
      calculation_pseudocode: |
        SELECT
          DATE_FORMAT(fk_wens_alarm_time, '%Y-%m') AS month,
          AVG(fk_wens_duration) AS avg_duration
        FROM tk_wens_production_anomal
        GROUP BY DATE_FORMAT(fk_wens_alarm_time, '%Y-%m')
      filter_conditions: []
      aggregation_logic: AVG(fk_wens_duration) GROUP BY month
      duplicate_handling: 直接平均
      time_logic: 按月分组
      implementation_risk:
        - 持续时长单位不明确

    - metric_id: T05
      metric_name: 7天复发率趋势
      business_definition: 按月统计7天复发率的月度趋势
      statistic_grain: 预警事件（按分组）
      source_analysis:
        tables:
          - table_name: wens_production_anomaly
            fields:
              - field_name: forgid
                field_usage: 分组条件
                description: 组织
              - field_name: fk_wens_basedatafield
