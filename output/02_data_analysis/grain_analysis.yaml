# ==========================================
# 数据粒度分析
# 农户生产异常预警分析
# ==========================================

project:
  project_id: wens_dw_project
  project_name: 农户生产异常预警分析

grain_analysis:
  tables:
    - table_name: wens_production_anomaly
      physical_table: tk_wens_production_anomal
      business_grain: 一条记录 = 一次生产异常预警事件
      technical_grain: 单据级（每行一条预警单据，包含主表和分录）
      grain_basis:
        - fbillno（单据编号）为每条记录的唯一标识
        - 每条记录关联一个养户(fk_wens_basedatafield)和一个猪群(fk_wens_recbrlrflk_pig)
        - 每条记录有独立的预警指标、等级、时间、状态
        - 一个养户可能同时有多条不同预警（不同猪群/不同指标/不同等级）
      grain_evidence:
        - 单据编号(fbillno)为业务主键
        - 养户+猪群+预警指标+预警等级+预警时间 组合可近似唯一标识
        - 存在分录表（预警接收人），主表粒度为单条预警事件
      candidate_keys:
        - fbillno
        - forgid + fk_wens_basedatafield + fk_wens_recbrlrflk_pig + fk_wens_alert_metric + fk_wens_alarm_level + fk_wens_alarm_time
      validation_items:
        - 验证fbillno是否唯一
        - 验证同一养户+猪群+指标+等级是否存在多条记录
        - 验证fk_wens_status枚举值是否只有1/2/3
        - 验证fk_wens_duration单位
      validation_sql:
        - "SELECT fbillno, COUNT(*) FROM tk_wens_production_anomal GROUP BY fbillno HAVING COUNT(*) > 1"
        - "SELECT fk_wens_status, COUNT(*) FROM tk_wens_production_anomal GROUP BY fk_wens_status"
        - "SELECT fk_wens_duration, COUNT(*) FROM tk_wens_production_anomal GROUP BY fk_wens_duration ORDER BY fk_wens_duration LIMIT 20"
      confidence: high
      confirmation_status: confirmed

    - table_name: wens_patrol_ticket
      physical_table: tk_wens_patrol_ticket
      business_grain: 一条记录 = 一次巡查工单
      technical_grain: 单据级（每行一条巡查工单，包含两个分录表）
      grain_basis:
        - fbillno（单据编号）为每条记录的唯一标识
        - 每条工单通过fk_wens_warning_billno关联一条预警
        - 每条工单有独立的工单状态
        - 包含两个分录：原因分析分录(tk_cause_analysis)和自定义风险分录(tk_wens_risk_item_entry)
      grain_evidence:
        - 单据编号(fbillno)为业务主键
        - fk_wens_warning_billno关联预警单据编号
        - 存在两个分录表，主表粒度为单条工单
      candidate_keys:
        - fbillno
      validation_items:
        - 验证fbillno是否唯一
        - 验证一条预警是否对应多条工单
        - 验证fk_wens_atrol_ticket_stat枚举值是否只有1/2/3
      validation_sql:
        - "SELECT fbillno, COUNT(*) FROM tk_wens_patrol_ticket GROUP BY fbillno HAVING COUNT(*) > 1"
        - "SELECT fk_wens_warning_billno, COUNT(*) as cnt FROM tk_wens_patrol_ticket GROUP BY fk_wens_warning_billno HAVING COUNT(*) > 1 LIMIT 10"
        - "SELECT fk_wens_atrol_ticket_stat, COUNT(*) FROM tk_wens_patrol_ticket GROUP BY fk_wens_atrol_ticket_stat"
      confidence: high
      confirmation_status: confirmed

    - table_name: wens_rearer_farm_pig
      physical_table: tk_wens_rea_farm_info
      business_grain: 一条记录 = 一个养户档案
      technical_grain: 基础资料级（每行一个养户主数据）
      grain_basis:
        - fmasterid（主数据内码）为养户唯一标识
        - fnumber（编码）为业务编码
        - 每个养户属于一个组织，有一个养殖场
        - 饲养状态标识养户当前状态
      grain_evidence:
        - 主数据内码(fmasterid)为主数据唯一标识
        - 编码(fnumber)为业务唯一标识
      candidate_keys:
        - fmasterid
        - fnumber
      validation_items:
        - 验证fmasterid是否唯一
        - 验证fnumber是否唯一
        - 验证fk_wens_status枚举值分布
      validation_sql:
        - "SELECT fmasterid, COUNT(*) FROM tk_wens_rea_farm_info GROUP BY fmasterid HAVING COUNT(*) > 1"
        - "SELECT fk_wens_status, COUNT(*) FROM tk_wens_rea_farm_info GROUP BY fk_wens_status"
      confidence: high
      confirmation_status: confirmed

    - table_name: wens_recbrlrflk_pig
      physical_table: tk_wens_recbrlrflk
      business_grain: 一条记录 = 一个猪群（畜禽档案）
      technical_grain: 基础资料级（每行一个猪群主数据）
      grain_basis:
        - fmasterid（主数据内码）为猪群唯一标识
        - fnumber（编码）为业务编码
        - 每个猪群关联一个养户档案(fk_wens_recrearer)
        - 猪群有独立的状态、品种、进苗信息
      grain_evidence:
        - 主数据内码(fmasterid)为主数据唯一标识
        - 编码(fnumber)为业务唯一标识
        - fk_wens_recrearer关联养户档案
      candidate_keys:
        - fmasterid
        - fnumber
      validation_items:
        - 验证fmasterid是否唯一
        - 验证一个养户下是否有多个猪群
        - 验证fk_wens_flkstatus枚举值分布
      validation_sql:
        - "SELECT fmasterid, COUNT(*) FROM tk_wens_recbrlrflk GROUP BY fmasterid HAVING COUNT(*) > 1"
        - "SELECT fk_wens_recrearer, COUNT(*) as flock_cnt FROM tk_wens_recbrlrflk GROUP BY fk_wens_recrearer HAVING COUNT(*) > 1 LIMIT 10"
        - "SELECT fk_wens_flkstatus, COUNT(*) FROM tk_wens_recbrlrflk GROUP BY fk_wens_flkstatus"
      confidence: high
      confirmation_status: confirmed

    - table_name: wens_handle_strategy
      physical_table: tk_wens_handle_strategy
      business_grain: 一条记录 = 一条风险-策略映射关系
      technical_grain: 基础资料级（每行一条策略配置）
      grain_basis:
        - fmasterid（主数据内码）为策略唯一标识
        - fnumber（编码）为业务编码
        - 每条策略关联一个风险大类和风险项
      grain_evidence:
        - 主数据内码(fmasterid)为主数据唯一标识
      candidate_keys:
        - fmasterid
        - fnumber
      validation_items:
        - 验证fmasterid是否唯一
        - 验证一个风险大类下有多少风险项
      validation_sql:
        - "SELECT fmasterid, COUNT(*) FROM tk_wens_handle_strategy GROUP BY fmasterid HAVING COUNT(*) > 1"
      confidence: medium
      confirmation_status: pending
