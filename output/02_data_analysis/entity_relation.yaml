# ==========================================
# 实体关系分析
# 农户生产异常预警分析
# ==========================================

project:
  project_id: wens_dw_project
  project_name: 农户生产异常预警分析

entity_relation_analysis:
  entities:
    - entity_name: 预警事件
      source_table: wens_production_anomaly
      relationships:
        - target_entity: 养户
          relationship_type: many_to_one
          join_keys:
            - source_field: fk_wens_basedatafield
              target_field: fmasterid
          relationship_basis: 预警表的养户字段(fk_wens_basedatafield)引用养户档案的主数据内码(fmasterid)
          confidence: high
        - target_entity: 猪群
          relationship_type: many_to_one
          join_keys:
            - source_field: fk_wens_recbrlrflk_pig
              target_field: fmasterid
          relationship_basis: 预警表的猪群编码字段(fk_wens_recbrlrflk_pig)引用畜禽档案的主数据内码(fmasterid)
          confidence: high
        - target_entity: 巡查工单
          relationship_type: one_to_many
          join_keys:
            - source_field: fbillno
              target_field: fk_wens_warning_billno
          relationship_basis: 巡查工单的预警单据编号(fk_wens_warning_billno)引用预警表的单据编号(fbillno)
          confidence: high

    - entity_name: 巡查工单
      source_table: wens_patrol_ticket
      relationships:
        - target_entity: 预警事件
          relationship_type: many_to_one
          join_keys:
            - source_field: fk_wens_warning_billno
              target_field: fbillno
          relationship_basis: 巡查工单通过预警单据编号关联预警事件
          confidence: high
        - target_entity: 养户
          relationship_type: many_to_one
          join_keys:
            - source_field: fk_wens_basedatafield
              target_field: fmasterid
          relationship_basis: 巡查工单的养户字段引用养户档案
          confidence: high
        - target_entity: 猪群
          relationship_type: many_to_one
          join_keys:
            - source_field: fk_wens_recbrlrflk_pig
              target_field: fmasterid
          relationship_basis: 巡查工单的猪群编码字段引用畜禽档案
          confidence: high
        - target_entity: 应对策略
          relationship_type: many_to_many
          join_keys:
            - source_field: tk_cause_analysis.fk_wens_handle_strategy
              target_field: fmasterid
          relationship_basis: 巡查工单的原因分析分录通过应对策略字段关联策略表
          confidence: high

    - entity_name: 养户
      source_table: wens_rearer_farm_pig
      relationships:
        - target_entity: 猪群
          relationship_type: one_to_many
          join_keys:
            - source_field: fmasterid
              target_field: fk_wens_recrearer
          relationship_basis: 畜禽档案的养户档案字段(fk_wens_recrearer)引用养户档案的主数据内码
          confidence: high
        - target_entity: 预警事件
          relationship_type: one_to_many
          join_keys:
            - source_field: fmasterid
              target_field: fk_wens_basedatafield
          relationship_basis: 预警表引用养户档案
          confidence: high

    - entity_name: 猪群
      source_table: wens_recbrlrflk_pig
      relationships:
        - target_entity: 养户
          relationship_type: many_to_one
          join_keys:
            - source_field: fk_wens_recrearer
              target_field: fmasterid
          relationship_basis: 每个猪群属于一个养户
          confidence: high
        - target_entity: 预警事件
          relationship_type: one_to_many
          join_keys:
            - source_field: fmasterid
              target_field: fk_wens_recbrlrflk_pig
          relationship_basis: 预警表引用畜禽档案
          confidence: high

    - entity_name: 应对策略
      source_table: wens_handle_strategy
      relationships:
        - target_entity: 巡查工单
          relationship_type: many_to_many
          join_keys:
            - source_field: fmasterid
              target_field: tk_cause_analysis.fk_wens_handle_strategy
          relationship_basis: 巡查工单分录引用应对策略
          confidence: high

  relationship_summary:
    - description: 预警事件 → 养户（多对一）
      source: wens_production_anomaly
      target: wens_rearer_farm_pig
      join: fk_wens_basedatafield = fmasterid
      confidence: high
    - description: 预警事件 → 猪群（多对一）
      source: wens_production_anomaly
      target: wens_recbrlrflk_pig
      join: fk_wens_recbrlrflk_pig = fmasterid
      confidence: high
    - description: 巡查工单 → 预警事件（多对一）
      source: wens_patrol_ticket
      target: wens_production_anomaly
      join: fk_wens_warning_billno = fbillno
      confidence: high
    - description: 巡查工单 → 养户（多对一）
      source: wens_patrol_ticket
      target: wens_rearer_farm_pig
      join: fk_wens_basedatafield = fmasterid
      confidence: high
    - description: 巡查工单 → 猪群（多对一）
      source: wens_patrol_ticket
      target: wens_recbrlrflk_pig
      join: fk_wens_recbrlrflk_pig = fmasterid
      confidence: high
    - description: 巡查工单 → 应对策略（多对多，通过分录）
      source: wens_patrol_ticket.tk_cause_analysis
      target: wens_handle_strategy
      join: fk_wens_handle_strategy = fmasterid
      confidence: high
    - description: 养户 → 猪群（一对多）
      source: wens_rearer_farm_pig
      target: wens_recbrlrflk_pig
      join: fmasterid = fk_wens_recrearer
      confidence: high
