# ==========================================
# Business Metric Analysis Schema
# Version: 1.1
#
# Purpose:
# Requirement Analysis Agent Output Contract
#
# Scope:
# 业务理解
# 页面分析
# 业务对象识别
# 指标定义
# 指标粒度分析
# 业务过程分析
# 业务规则沉淀
#
# NOT INCLUDE:
# 数据源分析
# 数仓模型设计
# SQL开发
# ==========================================


project:

  project_id:
    type: string
    required: true

  project_name:
    type: string
    required: true

  business_domain:
    type: string
    required: false


# ==========================================
# 1. 项目业务理解
# ==========================================

business_context:

  background:
    type: string

  business_goal:

    type: array

    items:

      type: string

  service_users:

    type: array

    items:

      type: string


# ==========================================
# 2. 页面分析
# 页面仅作为业务需求输入
# 不作为ADS拆分依据
# ==========================================

page_analysis:

  pages:

    type: array

    items:

      page_id:

        type: string

      page_name:

        type: string

      business_purpose:

        type: string

      components:

        type: array

        items:

          component_name:

            type: string

          display_metrics:

            type: array

            items:

              type: string

          display_grain:

            type: string


# ==========================================
# 3. 业务对象识别
# ==========================================

business_objects:

  objects:

    type: array

    items:

      object_name:

        type: string

      business_definition:

        type: string

      business_grain:

        type: string

      core_attributes:

        type: array

        items:

          type: string


# ==========================================
# 4. 业务过程分析
# ==========================================

business_process_analysis:

  processes:

    type: array

    items:

      process_name:

        type: string

      process_type:

        enum:

          - event
          - transaction
          - snapshot


      business_object:

        type: string


      process_grain:

        type: string


      process_description:

        type: string


# ==========================================
# 5. 指标分析
# ==========================================

metrics:

  atomic_metrics:

    type: array

    items:

      metric_id:

        type: string

      metric_name:

        type: string

      business_definition:

        type: string

      statistic_object:

        type: string


      statistic_grain:

        type: string


      calculation_logic:

        type: string


      business_rules:

        type: array

        items:

          type: string



  composite_metrics:

    type: array

    items:

      metric_id:

        type: string

      metric_name:

        type: string

      business_definition:

        type: string

      formula:

        type: string

      component_metrics:

        type: array

        items:

          type: string



  trend_metrics:

    type: array

    items:

      metric_id:

        type: string

      metric_name:

        type: string


      statistic_object:

        type: string


      statistic_grain:

        type: string


      display_time_grain:

        type: string


      analysis_dimensions:

        type: array

        items:

          type: string


# ==========================================
# 6. 指标业务粒度分析
# 核心：区分业务粒度和展示粒度
# ==========================================

metric_grain_analysis:

  metrics:

    type: array

    items:

      metric_id:

        type: string

      metric_name:

        type: string


      analysis_object:

        type: string


      business_statistic_grain:

        type: string


      source_grain:

        type: string


      display_grain:

        type: string

      calculation_basis:

        type: string

      drill_down_dimensions:

        type: array

        items:

          type: string


      aggregation_path:

        type: string

      calculation_logic_summary:
      
        type: string

# ==========================================
# 7. 业务规则
# ==========================================

business_rules:

  rules:

    type: array

    items:

      rule_id:

        type: string


      rule_description:

        type: string


      related_metrics:

        type: array

        items:

          type: string


      priority:

        enum:

          - confirmed
          - inferred


# ==========================================
# 8. 数据支撑初判
# 仅需求阶段初步判断
# Data Analysis阶段重新确认
# ==========================================

data_support_initial:

  metrics:

    type: array

    items:

      metric_id:

        type: string

      support_status:

        enum:

          - supported
          - partial
          - unknown


      possible_source_objects:

        type: array

        items:

          type: string


      missing_information:

        type: array

        items:

          type: string


# ==========================================
# 9. 待确认问题
# ==========================================

confirmation_questions:

  questions:

    type: array

    items:

      question_id:

        type: string


      question:

        type: string


      impact:

        type: string


      status:

        enum:

          - confirmed
          - pending


      answer:

        type: string
